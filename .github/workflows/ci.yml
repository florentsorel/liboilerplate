name: C

on:
  merge_group:
    types:
      - checks_requested
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
      - master

jobs:
  test:
    # gcc on Linux, clang on macOS: each compiler catches different things.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        mode: [debug, release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: make MODE=${{ matrix.mode }}
      - name: Run the example
        run: make MODE=${{ matrix.mode }} run
      - name: Run the tests
        run: make MODE=${{ matrix.mode }} tests
