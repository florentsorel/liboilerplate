name: C

on:
  merge_group:
    types:
      - checks_requested
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
      - master

jobs:
  test:
    # gcc on Linux, clang on macOS: each compiler catches different things.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        preset: [debug, release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      # Configure, build, then run the tests and the example with ctest.
      # --verbose in the build shows the full compiler commands in the logs.
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --verbose
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
